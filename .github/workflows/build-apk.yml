
name: Build Amata Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AmataCompanyApp_AndroidStudio_Project(1).zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      -       - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip -q 'AmataCompanyApp_AndroidStudio_Project(1).zip' -d source

      - name: Build APK
        working-directory: source/AmataCompanyApp
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AmataCompanyDirectory-APK
          path: source/AmataCompanyApp/app/build/outputs/apk/debug/app-debug.apk
          
