name: Build Amata Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'AmataCompanyDirectory2_Windows11_Project.zip'
      - '.github/workflows/build-windows-exe.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Windows app source
        shell: pwsh
        run: |
          Expand-Archive -Path "AmataCompanyDirectory2_Windows11_Project.zip" -DestinationPath "source" -Force
          Copy-Item -Path "source/windows-app" -Destination "windows-app" -Recurse -Force

      - name: Install dependencies
        working-directory: windows-app
        run: npm install

      - name: Build Windows installer
        working-directory: windows-app
        run: npm run dist

      - name: Upload EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: AmataCompanyDirectory2-Windows11-Setup
          path: windows-app/dist/*.exe
          if-no-files-found: error
          retention-days: 14
          
